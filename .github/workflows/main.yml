name: RDP Rocket Setup

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\tailscale.msi`"", "/quiet", "/norestart" -Wait

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Create Downloader Script on Desktops
        run: |
          $rdpProfile = Get-ChildItem "C:\Users" -Filter "RDP*" | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          if ($rdpProfile) { $rdpUserDir = $rdpProfile.FullName } else { $rdpUserDir = "C:\Users\RDP" }
          
          $rdpDesktop = "$rdpUserDir\Desktop"
          $publicDesktop = "C:\Users\Public\Desktop"
          
          if (-not (Test-Path $rdpDesktop)) { New-Item -ItemType Directory -Path $rdpDesktop -Force | Out-Null }
          
          # سكربت الباتش
          $payloadLines = @(
            '@echo off',
            'title RDP Rocket Downloader',
            'set DESKTOP_DIR=%USERPROFILE%\Desktop',
            'cd /d "%DESKTOP_DIR%"',
            'echo Preparing rocket downloads...',
            'echo Downloading files to Desktop...',
            'powershell -Command "Start-BitsTransfer -Source ''https://github.com/ALMASONYH/OctopusEAX/releases/download/Release/build.rar'' -Destination ''build.rar''"',
            'powershell -Command "Start-BitsTransfer -Source ''https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64'' -Destination ''DiscordSetup.exe''"',
            'powershell -Command "Start-BitsTransfer -Source ''https://download.vb-audio.com/Download_CABLE/Voicemeeter8Setup_v3130.zip'' -Destination ''Voicemeeter8Setup_v3130.zip''"',
            'powershell -Command "Start-BitsTransfer -Source ''https://dl.audiorelay.net/setups/windows/audiorelay-0.27.5.exe'' -Destination ''AudioRelaySetup.exe''"',
            'echo Fetching MediaFire files...',
            'curl.exe -L -o "malik.xml" "https://www.mediafire.com/file/t2sdckwtlzoua1h/malik.xml/file"',
            'curl.exe -L -o "Hero.m4a" "https://www.mediafire.com/file/t3y1oh7p66wzsrc/Hero.m4a/file"',
            'echo Installing Discord and AudioRelay silently...',
            'start /wait DiscordSetup.exe -s',
            'start /wait AudioRelaySetup.exe /S',
            'echo Extracting Voicemeeter...',
            'powershell -Command "Expand-Archive -Path ''Voicemeeter8Setup_v3130.zip'' -DestinationPath ''Voicemeeter_Extracted'' -Force"',
            'powershell -Command "$exe = Get-ChildItem -Path ''Voicemeeter_Extracted'' -Filter ''Voicemeeter*Setup*.exe'' -Recurse | Select-Object -First 1; if ($exe) { Copy-Item $exe.FullName -Destination ''VoicemeeterSetup.exe'' -Force }"',
            'echo All files are ready on your Desktop!',
            'pause'
          )
          
          $payload = $payloadLines -join "`r`n"
          
          Set-Content -Path "$rdpDesktop\Download_Files.bat" -Value $payload -Encoding ASCII
          Set-Content -Path "$publicDesktop\Download_Files.bat" -Value $payload -Encoding ASCII
          
          Write-Host "✅ Downloader Script placed on Desktops."

      - name: Keep Alive
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          $endTime = (Get-Date).AddMinutes(350)
          while ((Get-Date) -lt $endTime) {
            Write-Host "[$(Get-Date)] RDP Active..."
            Start-Sleep -Seconds 300
          }
