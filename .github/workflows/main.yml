name: RDP Rocket Setup

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\tailscale.msi`"", "/quiet", "/norestart" -Wait

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Create Downloader Script
        run: |
          $rdpProfile = Get-ChildItem "C:\Users" -Filter "RDP*" | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          if ($rdpProfile) { $rdpUserDir = $rdpProfile.FullName } else { $rdpUserDir = "C:\Users\RDP" }
          
          $rdpDesktop = "$rdpUserDir\Desktop"
          $rdpDownloads = "$rdpUserDir\Downloads"
          $rdpStartup = "$rdpUserDir\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          
          foreach ($dir in @($rdpDesktop, $rdpDownloads, $rdpStartup)) {
              if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
          }
          
          $payloadLines = @(
            '@echo off',
            'title RDP Rocket Downloader',
            'set TEMP_DIR=%USERPROFILE%\Downloads\TempDownloads',
            'if not exist "%TEMP_DIR%" mkdir "%TEMP_DIR%"',
            'cd /d "%TEMP_DIR%"',
            'echo Downloading files... Please wait.',
            'powershell -Command "Start-BitsTransfer -Source ''https://github.com/ALMASONYH/OctopusEAX/releases/download/Release/build.rar'' -Destination ''build.rar''"',
            'powershell -Command "Start-BitsTransfer -Source ''https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64'' -Destination ''DiscordSetup.exe''"',
            'powershell -Command "Start-BitsTransfer -Source ''https://download.vb-audio.com/Download_CABLE/Voicemeeter8Setup_v3130.zip'' -Destination ''Voicemeeter8Setup_v3130.zip''"',
            'powershell -Command "Start-BitsTransfer -Source ''https://dl.audiorelay.net/setups/windows/audiorelay-0.27.5.exe'' -Destination ''AudioRelaySetup.exe''"',
            'powershell -Command "Start-BitsTransfer -Source ''https://download850.mediafire.com/1axeek5wkwugtabX7RCw7LuQRS_X5SzZAcrFdv6dgwtijbT0UPJ1os7aJ-6LTPPWem8JfOlyGzwPBXsUM3BNfvX70JSoRD_0FUERluMd7_Pm2rqu5MpdoCMwq8YH_Fz6eWERx5yUlysXxMPVFJDgk8TZvnf3g8J2HxgfA9wkIID0Stj1/t2sdckwtlzoua1h/malik.xml'' -Destination ''malik.xml''"',
            'powershell -Command "Start-BitsTransfer -Source ''https://download1076.mediafire.com/ndqn2njrimlg1AZi9ZTT7Rb4BsaeWaFtSRPQkRGQtuSEbDml4UNidIEUjpGtB4_KfzoHyUJiuXMDgq8fxSlJbftWQTfSQdHmlTVh2v4TBZCBRgHTvSf-0coox2AidLDou0GxDbYV6Ag29wE-i3W3wCv5ujZcqNtGKvprFiR1Wgy6KMKO/t3y1oh7p66wzsrc/Hero.m4a'' -Destination ''Hero.m4a''"',
            'echo Installing Discord and AudioRelay...',
            'start /wait DiscordSetup.exe -s',
            'start /wait AudioRelaySetup.exe /S',
            'echo Extracting Voicemeeter...',
            'powershell -Command "Expand-Archive -Path ''Voicemeeter8Setup_v3130.zip'' -DestinationPath ''Voicemeeter_Extracted'' -Force"',
            'powershell -Command "(Get-ChildItem -Path ''Voicemeeter_Extracted'' -Filter ''Voicemeeter*Setup*.exe'' -Recurse | Select-Object -First 1).FullName | ForEach-Object { Copy-Item `$_ -Destination ''VoicemeeterSetup.exe'' -Force }"',
            'echo Copying files to Desktop and Downloads...',
            'xcopy /Y /E *.* "%USERPROFILE%\Desktop\"',
            'xcopy /Y /E *.* "%USERPROFILE%\Downloads\"',
            'echo Done! You can close this window.',
            'pause',
            'exit'
          )
          
          $payload = $payloadLines -join "`r`n"
          
          Set-Content -Path "$rdpDownloads\RocketDownloader.bat" -Value $payload -Encoding ASCII
          Set-Content -Path "$rdpDesktop\RocketDownloader.bat" -Value $payload -Encoding ASCII
          Set-Content -Path "$rdpStartup\RocketDownloader.bat" -Value $payload -Encoding ASCII

      - name: Keep Alive
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          $endTime = (Get-Date).AddMinutes(350)
          while ((Get-Date) -lt $endTime) {
            Write-Host "[$(Get-Date)] RDP Active..."
            Start-Sleep -Seconds 300
          }
