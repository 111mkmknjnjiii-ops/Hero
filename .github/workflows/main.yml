name: win 11 + tailscale + Download.bat script

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          if (-not (Get-LocalUser -Name "RDP")) {
            Write-Error "User creation failed"
            exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            Start-Sleep -Seconds 5
            $retries++
          }
          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned. Exiting."
            exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed"
            exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Download Payloads to RDP Downloads and Desktop
        run: |
          $rdpDownloads = "C:\Users\RDP\Downloads"
          $rdpDesktop = "C:\Users\RDP\Desktop"
          
          if (-not (Test-Path $rdpDownloads)) { New-Item -ItemType Directory -Path $rdpDownloads -Force | Out-Null }
          if (-not (Test-Path $rdpDesktop)) { New-Item -ItemType Directory -Path $rdpDesktop -Force | Out-Null }

          # 1. build.rar
          Write-Host "Downloading build.rar..."
          Invoke-WebRequest -Uri "https://github.com/ALMASONYH/OctopusEAX/releases/download/Release/build.rar" -OutFile "$rdpDownloads\build.rar" -UseBasicParsing

          # 2. Discord
          Write-Host "Downloading Discord..."
          $discordPath = "$rdpDownloads\DiscordSetup.exe"
          Invoke-WebRequest -Uri "https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64" -OutFile $discordPath -UseBasicParsing
          Write-Host "Installing Discord..."
          Start-Process -FilePath $discordPath -ArgumentList "-s" 

          # 3. Voicemeeter
          Write-Host "Downloading Voicemeeter..."
          $voiceMeterZipPath = "$rdpDownloads\Voicemeeter8Setup_v3130.zip"
          Invoke-WebRequest -Uri "https://download.vb-audio.com/Download_CABLE/Voicemeeter8Setup_v3130.zip" -OutFile $voiceMeterZipPath -UseBasicParsing
          Write-Host "Extracting Voicemeeter..."
          Expand-Archive -Path $voiceMeterZipPath -DestinationPath "$rdpDownloads\Voicemeeter_Extracted" -Force
          $vmSetup = Get-ChildItem -Path "$rdpDownloads\Voicemeeter_Extracted" -Filter "Voicemeeter*Setup*.exe" -Recurse | Select-Object -First 1
          if ($vmSetup) {
              Copy-Item -Path $vmSetup.FullName -Destination "$rdpDesktop\VoicemeeterSetup.exe" -Force
          }

          # 4. malik.xml
          Write-Host "Downloading malik.xml..."
          Invoke-WebRequest -Uri "https://download850.mediafire.com/1axeek5wkwugtabX7RCw7LuQRS_X5SzZAcrFdv6dgwtijbT0UPJ1os7aJ-6LTPPWem8JfOlyGzwPBXsUM3BNfvX70JSoRD_0FUERluMd7_Pm2rqu5MpdoCMwq8YH_Fz6eWERx5yUlysXxMPVFJDgk8TZvnf3g8J2HxgfA9wkIID0Stj1/t2sdckwtlzoua1h/malik.xml" -OutFile "$rdpDownloads\malik.xml" -UseBasicParsing

          # 5. Hero.m4a
          Write-Host "Downloading Hero.m4a..."
          Invoke-WebRequest -Uri "https://download1076.mediafire.com/ndqn2njrimlg1AZi9ZTT7Rb4BsaeWaFtSRPQkRGQtuSEbDml4UNidIEUjpGtB4_KfzoHyUJiuXMDgq8fxSlJbftWQTfSQdHmlTVh2v4TBZCBRgHTvSf-0coox2AidLDou0GxDbYV6Ag29wE-i3W3wCv5ujZcqNtGKvprFiR1Wgy6KMKO/t3y1oh7p66wzsrc/Hero.m4a" -OutFile "$rdpDownloads\Hero.m4a" -UseBasicParsing

          # 6. AudioRelay
          Write-Host "Downloading AudioRelay..."
          $audioRelayPath = "$rdpDownloads\AudioRelaySetup.exe"
          Invoke-WebRequest -Uri "https://dl.audiorelay.net/setups/windows/audiorelay-0.27.5.exe" -OutFile $audioRelayPath -UseBasicParsing
          Write-Host "Installing AudioRelay..."
          Start-Process -FilePath $audioRelayPath -ArgumentList "/S"

          # نسخ كل شي للديسكتوب
          Copy-Item -Path "$rdpDownloads\*" -Destination $rdpDesktop -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "✅ All files processed."
          
      - name: Maintain Connection + Watch RDP User
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"
          
          # تفعيل الباتش
          if (Test-Path $rdpProfile) {
            try {
              if (-not (Test-Path $startupPath)) { New-Item -ItemType Directory -Path $startupPath -Force | Out-Null }
              Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
              Write-Host "✅ Downloads.bat copied."
              cmd /c $downloadPath
              Write-Host "✅ Downloads.bat executed."
            } catch { 
              Write-Host "❌ Error executing Downloads.bat"
            }
          }
          
          # حلقة الانتظار (6 ساعات)
          $endTime = (Get-Date).AddMinutes(350)
          while ((Get-Date) -lt $endTime) {
            Write-Host "[$(Get-Date)] RDP Active - Keep-Alive running"
            Start-Sleep -Seconds 300
          }
