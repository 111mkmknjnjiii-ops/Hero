name: RDP Rocket Setup

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\tailscale.msi`"", "/quiet", "/norestart" -Wait

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Create Downloader Script on Desktops
        run: |
          # البحث عن بروفايل RDP
          $rdpProfile = Get-ChildItem "C:\Users" -Filter "RDP*" | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          if ($rdpProfile) { $rdpUserDir = $rdpProfile.FullName } else { $rdpUserDir = "C:\Users\RDP" }
          
          $rdpDesktop = "$rdpUserDir\Desktop"
          $publicDesktop = "C:\Users\Public\Desktop"
          
          # إنشاء مسار الديسكتوب حق RDP اذا ما كان موجود، وتجهيز المسار العام
          if (-not (Test-Path $rdpDesktop)) { New-Item -ItemType Directory -Path $rdpDesktop -Force | Out-Null }
          
          # سكربت الباتش 
          $payloadLines = @(
            '@echo off',
            'title RDP Rocket Downloader',
            'set DESKTOP_DIR=%USERPROFILE%\Desktop',
            'cd /d "%DESKTOP_DIR%"',
            'echo Preparing rocket downloads...',
            'curl.exe -L -s -o aria2c.exe "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip"',
            'set ARIA=aria2c.exe -x 16 -s 16 -k 1M --file-allocation=none --console-log-level=error',
            'echo Downloading files to Desktop...',
            '%ARIA% -o build.rar "https://github.com/ALMASONYH/OctopusEAX/releases/download/Release/build.rar"',
            '%ARIA% -o DiscordSetup.exe "https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64"',
            '%ARIA% -o Voicemeeter8Setup_v3130.zip "https://download.vb-audio.com/Download_CABLE/Voicemeeter8Setup_v3130.zip"',
            '%ARIA% -o AudioRelaySetup.exe "https://dl.audiorelay.net/setups/windows/audiorelay-0.27.5.exe"',
            'echo Fetching MediaFire links dynamically...',
            'powershell -Command "$c = (Invoke-WebRequest -Uri ''https://www.mediafire.com/file/t2sdckwtlzoua1h/malik.xml/file'' -UseBasicParsing).Content; if($c -match ''href="(https://download[^"]+)"''){ $url = $matches[1]; .\aria2c.exe -x 16 -s 16 -o malik.xml $url }"',
            'powershell -Command "$c = (Invoke-WebRequest -Uri ''https://www.mediafire.com/file/t3y1oh7p66wzsrc/Hero.m4a/file'' -UseBasicParsing).Content; if($c -match ''href="(https://download[^"]+)"''){ $url = $matches[1]; .\aria2c.exe -x 16 -s 16 -o Hero.m4a $url }"',
            'echo Installing Discord and AudioRelay silently...',
            'start /wait DiscordSetup.exe -s',
            'start /wait AudioRelaySetup.exe /S',
            'echo Extracting Voicemeeter...',
            'powershell -Command "Expand-Archive -Path ''Voicemeeter8Setup_v3130.zip'' -DestinationPath ''Voicemeeter_Extracted'' -Force"',
            'powershell -Command "$exe = Get-ChildItem -Path ''Voicemeeter_Extracted'' -Filter ''Voicemeeter*Setup*.exe'' -Recurse | Select-Object -First 1; if ($exe) { Copy-Item $exe.FullName -Destination ''VoicemeeterSetup.exe'' -Force }"',
            'del aria2c.exe',
            'echo All files are ready on your Desktop!',
            'pause'
          )
          
          $payload = $payloadLines -join "`r`n"
          
          # حفظ الملف في الديسكتوب حق RDP
          Set-Content -Path "$rdpDesktop\Download_Files.bat" -Value $payload -Encoding ASCII
          
          # حفظ الملف في الديسكتوب العام (Public Desktop) عشان يبان في كل الحالات
          Set-Content -Path "$publicDesktop\Download_Files.bat" -Value $payload -Encoding ASCII
          
          Write-Host "✅ Downloader Script placed on RDP Desktop and Public Desktop. It will NOT run automatically."

      - name: Keep Alive
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          $endTime = (Get-Date).AddMinutes(350)
          while ((Get-Date) -lt $endTime) {
            Write-Host "[$(Get-Date)] RDP Active - Monitoring connection..."
            Start-Sleep -Seconds 300
          }
