name: win 11 + tailscale + Download.bat script

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            Start-Sleep -Seconds 5
            $retries++
          }
          if (-not $tsIP) { exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Prepare Manual Download Script on Desktops
        run: |
          # سكربت التحميل الصاروخي (BITS)
          $payloadContent = @"
          @echo off
          title Downloading Files... Please Wait
          echo Starting downloads...
          
          set TEMP_DIR=%USERPROFILE%\Desktop\TempDownloads
          if not exist "%TEMP_DIR%" mkdir "%TEMP_DIR%"
          cd /d "%TEMP_DIR%"

          echo [1/6] Downloading build.rar...
          start /b powershell -Command "Start-BitsTransfer -Source 'https://github.com/ALMASONYH/OctopusEAX/releases/download/Release/build.rar' -Destination 'build.rar' -DisplayName 'build.rar'"

          echo [2/6] Downloading Discord (Rocket Speed)...
          start /b powershell -Command "Start-BitsTransfer -Source 'https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64' -Destination 'DiscordSetup.exe' -DisplayName 'DiscordSetup'"

          echo [3/6] Downloading Voicemeeter...
          start /b powershell -Command "Start-BitsTransfer -Source 'https://download.vb-audio.com/Download_CABLE/Voicemeeter8Setup_v3130.zip' -Destination 'Voicemeeter8Setup_v3130.zip' -DisplayName 'Voicemeeter'"

          echo [4/6] Downloading malik.xml...
          start /b powershell -Command "Start-BitsTransfer -Source 'https://download850.mediafire.com/1axeek5wkwugtabX7RCw7LuQRS_X5SzZAcrFdv6dgwtijbT0UPJ1os7aJ-6LTPPWem8JfOlyGzwPBXsUM3BNfvX70JSoRD_0FUERluMd7_Pm2rqu5MpdoCMwq8YH_Fz6eWERx5yUlysXxMPVFJDgk8TZvnf3g8J2HxgfA9wkIID0Stj1/t2sdckwtlzoua1h/malik.xml' -Destination 'malik.xml' -DisplayName 'malik'"

          echo [5/6] Downloading Hero.m4a...
          start /b powershell -Command "Start-BitsTransfer -Source 'https://download1076.mediafire.com/ndqn2njrimlg1AZi9ZTT7Rb4BsaeWaFtSRPQkRGQtuSEbDml4UNidIEUjpGtB4_KfzoHyUJiuXMDgq8fxSlJbftWQTfSQdHmlTVh2v4TBZCBRgHTvSf-0coox2AidLDou0GxDbYV6Ag29wE-i3W3wCv5ujZcqNtGKvprFiR1Wgy6KMKO/t3y1oh7p66wzsrc/Hero.m4a' -Destination 'Hero.m4a' -DisplayName 'hero'"

          echo [6/6] Downloading AudioRelay...
          start /b powershell -Command "Start-BitsTransfer -Source 'https://dl.audiorelay.net/setups/windows/audiorelay-0.27.5.exe' -Destination 'AudioRelaySetup.exe' -DisplayName 'audiorelay'"

          echo Waiting for all downloads to finish...
          timeout /t 45 /nobreak >nul
          
          :check
          tasklist /FI "IMAGENAME eq powershell.exe" 2>NUL | find /I /N "powershell.exe">NUL
          if "%ERRORLEVEL%"=="0" (
              echo Still downloading... please wait.
              timeout /t 10 /nobreak >nul
              goto check
          )

          echo All downloads complete! Installing...
          start /wait DiscordSetup.exe -s
          start /wait AudioRelaySetup.exe /S
          
          echo Extracting Voicemeeter...
          powershell -Command "Expand-Archive -Path 'Voicemeeter8Setup_v3130.zip' -DestinationPath 'Voicemeeter_Extracted' -Force"
          powershell -Command "(Get-ChildItem -Path 'Voicemeeter_Extracted' -Filter 'Voicemeeter*Setup*.exe' -Recurse | Select-Object -First 1).FullName | ForEach-Object { Copy-Item `$_ -Destination 'VoicemeeterSetup.exe' -Force }"
          
          echo Copying files to Desktop...
          xcopy /Y /E *.* "%USERPROFILE%\Desktop\"
          
          echo Finished! You can close this window.
          pause
          "@

          # مسح أي ملفات قديمة من الـ Startup عشان ما يشتغل تلقائي
          $publicStartup = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          if (Test-Path "$publicStartup\Download_Files.bat") { Remove-Item "$publicStartup\Download_Files.bat" -Force -ErrorAction SilentlyContinue }
          
          # توزيع الباتش على ديسكتوب RDP
          $rdpDesktop = "C:\Users\RDP\Desktop"
          if (-not (Test-Path $rdpDesktop)) { New-Item -ItemType Directory -Path $rdpDesktop -Force | Out-Null }
          Set-Content -Path "$rdpDesktop\Download_Files.bat" -Value $payloadContent -Encoding ASCII

          # توزيع الباتش على ديسكتوب Administrator
          $adminDesktop = "C:\Users\Administrator\Desktop"
          if (-not (Test-Path $adminDesktop)) { New-Item -ItemType Directory -Path $adminDesktop -Force | Out-Null }
          Set-Content -Path "$adminDesktop\Download_Files.bat" -Value $payloadContent -Encoding ASCII

          Write-Host "✅ Download script placed on Desktops (Manual Run Only)."

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          $endTime = (Get-Date).AddMinutes(350)
          while ((Get-Date) -lt $endTime) {
            Write-Host "[$(Get-Date)] RDP Active - Waiting for you..."
            Start-Sleep -Seconds 300
          }
