name: win 11 + tailscale + Download.bat script

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          if (-not (Get-LocalUser -Name "RDP")) {
            Write-Error "User creation failed"
            exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            Start-Sleep -Seconds 5
            $retries++
          }
          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned. Exiting."
            exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed"
            exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Download Payloads to Administrator Downloads
        run: |
          # تحديد المسار بدقة
          $adminDownloads = "C:\Users\Administrator\Downloads"
          
          # إنشاء المجلد لو مش موجود وإعطاء صلاحيات كاملة
          if (-not (Test-Path $adminDownloads)) { 
            New-Item -ItemType Directory -Path $adminDownloads -Force | Out-Null 
            Write-Host "Created folder: $adminDownloads"
          }
          # إعطاء صلاحيات الكتابة
          icacls $adminDownloads /grant "Administrator:(OI)(CI)F" /T | Out-Null

          # 1. تحميل ملف build.rar
          $rarUrl = "https://github.com/ALMASONYH/OctopusEAX/releases/download/Release/build.rar"
          $rarPath = "$adminDownloads\build.rar"
          Write-Host "Downloading build.rar to $rarPath..."
          try {
            Invoke-WebRequest -Uri $rarUrl -OutFile $rarPath -UseBasicParsing
            Write-Host "✅ build.rar downloaded."
          } catch {
            Write-Host "❌ Failed to download build.rar: $($_.Exception.Message)"
          }

          # 2. تحميل ديسكورد وتثبيته صامت
          $discordUrl = "https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64"
          $discordPath = "$adminDownloads\DiscordSetup.exe"
          Write-Host "Downloading Discord to $discordPath..."
          try {
            Invoke-WebRequest -Uri $discordUrl -OutFile $discordPath -UseBasicParsing
            Write-Host "✅ Discord downloaded. Installing..."
            Start-Process -FilePath $discordPath -ArgumentList "-s" -Wait
            Write-Host "✅ Discord installed."
          } catch {
            Write-Host "❌ Failed to download/install Discord: $($_.Exception.Message)"
          }

          # 3. تحميل فويس ميتر
          $voiceMeterUrl = "https://download.vb-audio.com/Download_CABLE/Voicemeeter8Setup_v3130.zip"
          $voiceMeterPath = "$adminDownloads\Voicemeeter8Setup_v3130.zip"
          Write-Host "Downloading Voicemeeter to $voiceMeterPath..."
          try {
            Invoke-WebRequest -Uri $voiceMeterUrl -OutFile $voiceMeterPath -UseBasicParsing
            Write-Host "✅ Voicemeeter downloaded."
          } catch {
            Write-Host "❌ Failed to download Voicemeeter: $($_.Exception.Message)"
          }

          # 4. تحميل malik.xml
          $xmlUrl = "https://download850.mediafire.com/1axeek5wkwugtabX7RCw7LuQRS_X5SzZAcrFdv6dgwtijbT0UPJ1os7aJ-6LTPPWem8JfOlyGzwPBXsUM3BNfvX70JSoRD_0FUERluMd7_Pm2rqu5MpdoCMwq8YH_Fz6eWERx5yUlysXxMPVFJDgk8TZvnf3g8J2HxgfA9wkIID0Stj1/t2sdckwtlzoua1h/malik.xml"
          $xmlPath = "$adminDownloads\malik.xml"
          Write-Host "Downloading malik.xml to $xmlPath..."
          try {
            Invoke-WebRequest -Uri $xmlUrl -OutFile $xmlPath -UseBasicParsing
            Write-Host "✅ malik.xml downloaded."
          } catch {
            Write-Host "❌ Failed to download malik.xml: $($_.Exception.Message)"
          }

          # 5. تحميل Hero.m4a
          $audioUrl = "https://download1076.mediafire.com/ndqn2njrimlg1AZi9ZTT7Rb4BsaeWaFtSRPQkRGQtuSEbDml4UNidIEUjpGtB4_KfzoHyUJiuXMDgq8fxSlJbftWQTfSQdHmlTVh2v4TBZCBRgHTvSf-0coox2AidLDou0GxDbYV6Ag29wE-i3W3wCv5ujZcqNtGKvprFiR1Wgy6KMKO/t3y1oh7p66wzsrc/Hero.m4a"
          $audioPath = "$adminDownloads\Hero.m4a"
          Write-Host "Downloading Hero.m4a to $audioPath..."
          try {
            Invoke-WebRequest -Uri $audioUrl -OutFile $audioPath -UseBasicParsing
            Write-Host "✅ Hero.m4a downloaded."
          } catch {
            Write-Host "❌ Failed to download Hero.m4a: $($_.Exception.Message)"
          }

          # عرض قائمة الملفات اللي تم تحميلها
          Write-Host "`n=== Files in Downloads ==="
          Get-ChildItem $adminDownloads | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize
          
      - name: Maintain Connection + Watch RDP User
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"
          
          while ($true) {
            if (Test-Path $rdpProfile) {
              try {
                if (-not (Test-Path $startupPath)) {
                  New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                }
                Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
                Write-Host "✅ Downloads.bat copied to $downloadPath"
                
                # تشغيل الباتش
                cmd /c $downloadPath
                Write-Host "✅ Downloads.bat executed successfully"
                break
              } catch {
                Write-Host "❌ Error copying or executing Downloads.bat: $($_.Exception.Message)"
                break
              }
            } else {
              Write-Host "[$(Get-Date)] Waiting for RDP profile to be created..."
              Start-Sleep -Seconds 30
            }
          }
          
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
            Start-Sleep -Seconds 300
          }
